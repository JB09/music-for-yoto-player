name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      # Errors only: syntax errors, undefined names and other likely bugs.
      # Style rules are left out so CI stays green on the existing code.
      - name: Check for errors
        run: ruff check --output-format=github --select E9,F63,F7,F82 .

      - name: Check formatting/style (informational)
        continue-on-error: true
        run: ruff check --output-format=github .

  build:
    name: Build (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile all sources
        run: python -m compileall -q .

      - name: Import smoke test
        run: python -c "import music_providers, playlist_chat, yoto_client, icon_selector"

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: music-for-yoto-player:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the app imports inside the image
        run: docker run --rm music-for-yoto-player:ci python -c "import web_app; print('web_app ok')"
