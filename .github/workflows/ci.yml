name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The Dockerfile base image is the single source of truth for the Python
      # version, so a Dependabot image bump moves CI with it automatically.
      - name: Read Python version from Dockerfile
        id: pyver
        run: echo "version=$(grep -oP '^FROM python:\K[0-9]+\.[0-9]+' Dockerfile)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.pyver.outputs.version }}

      - name: Install ruff
        run: pip install ruff

      # Errors only: syntax errors, undefined names and other likely bugs.
      # Style rules are left out so CI stays green on the existing code.
      - name: Check for errors
        run: ruff check --output-format=github --select E9,F63,F7,F82 .

      - name: Check formatting/style (informational)
        continue-on-error: true
        run: ruff check --output-format=github .

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read Python version from Dockerfile
        id: pyver
        run: echo "version=$(grep -oP '^FROM python:\K[0-9]+\.[0-9]+' Dockerfile)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.pyver.outputs.version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Byte-compile all sources
        run: python -m compileall -q .

      - name: Import smoke test
        run: python -c "import music_providers, playlist_chat, yoto_client, icon_selector"

      - name: Run tests
        run: pytest

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: music-for-yoto-player:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the app imports inside the image
        run: docker run --rm music-for-yoto-player:ci python -c "import web_app; print('web_app ok')"
