services:
  yoto-scraper:
    image: ghcr.io/jb09/music-for-yoto-player:latest
    pull_policy: always
    ports:
      - "5000:5000"
    volumes:
      - ./downloads:/app/downloads
    networks:
      - backend
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # Claude model; empty = newest Claude Sonnet
      - CLAUDE_MODEL=${CLAUDE_MODEL:-}
      - YOTO_CLIENT_ID=${YOTO_CLIENT_ID:-}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-}
      - OUTPUT_DIR=/app/downloads
      # Music provider: "youtube" (default) or "plex"
      - MUSIC_PROVIDER=${MUSIC_PROVIDER:-youtube}
      # YouTube provider: yt-dlp-host sidecar (recommended)
      - DOWNLOAD_SERVICE_URL=${DOWNLOAD_SERVICE_URL:-http://ytdlp:5000}
      - DOWNLOAD_API_KEY=${DOWNLOAD_API_KEY:-}
      # Plex provider (only if MUSIC_PROVIDER=plex)
      - PLEX_URL=${PLEX_URL:-}
      - PLEX_TOKEN=${PLEX_TOKEN:-}
      - PLEX_MUSIC_LIBRARY=${PLEX_MUSIC_LIBRARY:-Music}
    depends_on:
      ytdlp:
        condition: service_started
        required: false

  # yt-dlp download service (user-provided, handles YouTube audio downloads)
  # The user chooses to run this service — it is not bundled with this project.
  # See: https://github.com/Vasysik/yt-dlp-host
  #
  # Built from the upstream repo's own Dockerfile (Python slim + ffmpeg + Deno,
  # which yt-dlp needs for YouTube). Pinned to a commit so an upstream rewrite
  # can't break the build; bump it to pick up newer releases. yt-dlp-host runs
  # as two processes: the API (ytdlp) and the downloader (ytdlp-worker), which
  # share state and files through the volumes below.
  # The admin key is created from DOWNLOAD_API_KEY on first start.
  ytdlp:
    build:
      context: https://github.com/Vasysik/yt-dlp-host.git#d672d8f903d600d3d339b82afa381ccd896afc82
    image: yoto-ytdlp:local
    pull_policy: build
    volumes: &ytdlp-volumes
      - ytdlp-state:/app/data
      - ytdlp-files:/app/downloads
    networks:
      - backend
    environment: &ytdlp-env
      - ADMIN_API_KEY=${DOWNLOAD_API_KEY:-}
      - STORAGE_BACKEND=sqlite
      - LOG_LEVEL=INFO
    restart: unless-stopped
    profiles:
      - youtube

  ytdlp-worker:
    image: yoto-ytdlp:local
    pull_policy: never
    command: ["python", "-m", "yt_dlp_host.worker"]
    depends_on:
      - ytdlp
    volumes: *ytdlp-volumes
    networks:
      - backend
    environment: *ytdlp-env
    restart: unless-stopped
    profiles:
      - youtube

networks:
  backend:
    driver: bridge

volumes:
  ytdlp-state:
  ytdlp-files:
